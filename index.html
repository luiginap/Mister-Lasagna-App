<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mister Lasagna">
<meta name="theme-color" content="#A01A1C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>Mister Lasagna — Stock Check</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F2EF;color:#1C1C1E;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:160px}
html[data-zoom="s"] body{zoom:0.88}
html[data-zoom="m"] body{zoom:1}
html[data-zoom="l"] body{zoom:1.15}

/* ─── HEADER ─── */
.hdr{background:#fff;padding:8px 16px 0;position:sticky;top:0;z-index:30;border-bottom:0.5px solid #E5E0DB}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hdr-logo{height:42px;width:42px;flex-shrink:0;object-fit:contain;border-radius:6px;background:#fff;padding:3px;border:1px solid #E5E0DB}
.hdr-text{flex:1;min-width:0}
.hdr-title{font-size:15px;font-weight:800;color:#1C1C1E;line-height:1.1;letter-spacing:-.01em}
.hdr-sub{font-size:11px;color:#8E8E93;margin-top:1px}
.hdr-zoom{display:flex;gap:3px;flex-shrink:0;background:#F4F2EF;border-radius:8px;padding:2px}
.hdr-zoom button{border:none;background:none;font-size:10px;font-weight:700;padding:5px 7px;border-radius:6px;cursor:pointer;color:#8E8E93;min-width:24px}
.hdr-zoom button.on{background:#fff;color:#A01A1C;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hdr-info{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1.5px solid #E5E0DB;background:#fff;color:#A01A1C;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.hdr-info:active{background:#F4F2EF}
.hdr-tabs{display:flex}
.htab{flex:1;padding:9px 0;font-size:14px;font-weight:600;text-align:center;cursor:pointer;color:#8E8E93;border:none;border-bottom:2px solid transparent;background:none}
.htab.active{color:#A01A1C;border-bottom-color:#A01A1C}

/* ─── EXCEL-STYLE STOCK CHECK ─── */
.sc-banner{background:#0B2545;color:#fff;padding:11px 14px;text-align:center;font-weight:800;letter-spacing:.03em;margin:12px 12px 0;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.sc-banner .ico{font-size:18px}
.sc-dateline{display:flex;margin:8px 12px 0;gap:8px}
.sc-dateline > div{flex:1;background:#0B2545;color:#fff;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}
.sc-dateline .v{flex:1;background:#fff;color:#1C1C1E;border-radius:5px;padding:3px 8px;font-weight:700;font-size:11px;text-align:center}
.sc-thead{display:grid;grid-template-columns:1fr 60px 78px 78px;gap:6px;margin:8px 12px 0;padding:10px 8px;background:#0B2545;color:#fff;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;align-items:center}
.sc-thead .col-name{text-align:left;padding-left:6px}
.sc-thead .col-min{background:transparent}
.sc-thead .col-stock{background:#FF7A00;color:#fff;border-radius:4px;padding:4px 2px;font-size:9px;line-height:1.15}
.sc-thead .col-ord{background:#F5C842;color:#1C1C1E;border-radius:4px;padding:4px 2px;font-size:9px;line-height:1.15}

.sc-group{margin:0 12px}
.sc-grouphd{margin-top:8px;background:#0B2545;color:#fff;padding:9px 12px;font-size:13px;font-weight:700;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px}
.sc-grouphd .ico{font-size:15px}
.sc-grouplist{background:#fff;border-radius:0 0 8px 8px;overflow:hidden;border:1px solid #E5E0DB;border-top:none}
.sc-row{display:grid;grid-template-columns:1fr 60px 78px 78px;gap:6px;padding:8px 8px;border-bottom:0.5px solid #F2F2F7;align-items:center;font-size:13px}
.sc-row:last-child{border-bottom:none}
.sc-row.zebra{background:#FAFAFA}
.sc-name{font-size:13px;color:#1C1C1E;padding-left:6px;line-height:1.25;word-wrap:break-word;overflow-wrap:break-word}
.sc-min{text-align:center;font-weight:600;color:#3A3A3C;font-size:13px}
.sc-stock-cell{position:relative}
.sc-stock-cell input{width:100%;border:1.5px solid #FFE0B8;border-radius:6px;background:#FFF7EC;text-align:center;padding:8px 4px;font-size:14px;font-weight:700;color:#A04500;outline:none;-moz-appearance:textfield;font-family:inherit}
.sc-stock-cell input::-webkit-outer-spin-button,.sc-stock-cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sc-stock-cell input:focus{border-color:#FF7A00;background:#fff}
.sc-stock-cell input::placeholder{color:#D8B889;font-weight:400}
.sc-ord{text-align:center;font-weight:800;font-size:15px;padding:8px 4px;border-radius:6px;background:#FFF7C8;color:#7A5800}
.sc-ord.zero{background:#F4F2EF;color:#C7C7CC;font-weight:500}

/* Free-order row (MIN=0): toggle + stepper */
.sc-row.free{grid-template-columns:46px 1fr 124px}
.sc-row.free .sc-name{padding-left:0}
.sc-row.free.off .sc-name{text-decoration:line-through;color:#A8A29B}
.sw{width:42px;height:24px;position:relative;cursor:pointer;flex-shrink:0;justify-self:center}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-t{position:absolute;inset:0;border-radius:12px;background:#D1D1D6;transition:background .2s}
.sw input:checked~.sw-t{background:#30D158}
.sw-k{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked~.sw-k{transform:translateX(18px)}
.qty{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.qty button{width:30px;height:30px;border-radius:50%;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;flex-shrink:0;font-weight:600;padding:0;line-height:1}
.qty button:active{background:#E5E5EA}
.qty button.dec{color:#A01A1C}
.qty button.inc{color:#30D158}
.qty button:disabled{opacity:.3;cursor:default}
.qty .qv{min-width:34px;text-align:center;font-size:15px;font-weight:700;color:#1C1C1E;font-variant-numeric:tabular-nums}
.qty .qv.zero{color:#C7C7CC}
.sc-row.free.off .qty{opacity:.4;pointer-events:none}
.sc-ord.hot{background:#FFD3D3;color:#8B0000;animation:flashHot .8s ease-out}
@keyframes flashHot{0%{background:#FF6B6B;color:#fff}100%{background:#FFD3D3;color:#8B0000}}

.sc-footer{margin:14px 12px 0;background:#0B2545;color:#fff;padding:12px 14px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc-footer-l{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sc-footer-c{background:#FF3B30;color:#fff;font-size:24px;font-weight:800;padding:4px 16px;border-radius:6px;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.sc-footer-c.zero{background:#3A4C66}
.sc-footer-r{font-size:12px;color:#A8B4C7}

/* ─── ACTION BAR ─── */
.abar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:0.5px solid #E5E0DB;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:25}
.abar-row{display:flex;gap:7px;align-items:stretch}
.btn-rst{flex-shrink:0;padding:0 14px;border-radius:10px;border:1.5px solid #E5E0DB;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#8E8E93;white-space:nowrap}
.btn-cpy{flex-shrink:0;padding:0 14px;border-radius:10px;border:1.5px solid #E5E0DB;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1C1C1E}
.btn-wa{flex:1;padding:11px 8px;border-radius:10px;border:none;background:#25D366;font-size:13px;font-weight:700;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;line-height:1.2}
.btn-wa .wa-l1{font-size:12px;font-weight:700}
.btn-wa .wa-l2{font-size:10px;font-weight:500;opacity:.92}
.btn-wa:active{background:#1FB855}
.btn-wa.disabled{background:#D1D1D6;cursor:default;color:#fff}
.btn-wa.disabled:active{background:#D1D1D6}

/* ─── SUPPLIERS TAB ─── */
.sup-wrap{padding:14px 16px 20px}
.sup-banner{padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.5;background:#FBEFEF;color:#6B1112;border-left:3px solid #A01A1C;margin-bottom:14px}
.sup-banner b{color:#A01A1C}
.sup-card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.05);cursor:pointer}
.sup-card:active{transform:scale(.99)}
.sup-card-hd{padding:14px;display:flex;align-items:center;gap:12px}
.sup-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.sup-info{flex:1;min-width:0}
.sup-name{font-size:16px;font-weight:700;color:#1C1C1E}
.sup-meta{font-size:11px;color:#8E8E93;margin-top:2px}
.sup-cnt{background:#FFF7C8;color:#7A5800;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;min-width:56px;text-align:center;line-height:1.2}
.sup-cnt.zero{background:#F4F2EF;color:#C7C7CC;font-weight:600}
.sup-cnt.hot{background:#FFD3D3;color:#8B0000}
.sup-cnt small{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.8;margin-top:1px}
.sup-arrow{font-size:18px;color:#C7C7CC;flex-shrink:0;font-weight:300}

.sup-back{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:8px 4px;cursor:pointer;font-size:14px;font-weight:600;color:#A01A1C;background:none;border:none}
.sup-contact{margin:0 12px 0;background:#fff;border-radius:12px;padding:13px 14px;border:1px solid #E5E0DB}
.sup-contact-hd{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sup-contact-name{font-size:15px;font-weight:700;color:#1C1C1E;flex:1}
.sup-contact-row{font-size:12px;color:#3A3A3C;line-height:1.5;margin:3px 0 0 20px}
.sup-contact-row a{color:#A01A1C;text-decoration:none;font-weight:600}
.sup-contact-meta{font-size:11px;color:#A8A29B;margin-top:7px;padding-top:7px;border-top:0.5px solid #F2F2F7}

/* ─── MODAL (help & detail) ─── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:100}
.mdl{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto;padding:20px 16px 40px}
.mdl-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mdl-title{font-size:16px;font-weight:700;flex:1}
.btn-x{width:32px;height:32px;border-radius:50%;border:none;background:#F4F2EF;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8E8E93;padding:0;line-height:1;flex-shrink:0}
.lang-btn{border:none;font-size:11px;font-weight:700;padding:6px 11px;border-radius:12px;cursor:pointer;flex-shrink:0}
.lang-btn.on{background:#A01A1C;color:#fff}
.lang-btn.off{background:#F4F2EF;color:#8E8E93}
.guide-step{display:flex;gap:12px;margin-bottom:14px}
.guide-n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#A01A1C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.guide-h{font-size:14px;font-weight:700;margin-bottom:3px}
.guide-b{font-size:13px;line-height:1.5;color:#3A3A3C}
.guide-b b{color:#1C1C1E}
.guide-box{padding:10px 12px;border-radius:10px;background:#FBEFEF;margin-top:8px}
.guide-box-h{font-size:13px;font-weight:700;color:#6B1112;margin-bottom:3px}
.guide-box-b{font-size:12px;line-height:1.5;color:#6B1112}
.guide-sign{font-size:12px;color:#8E8E93;text-align:center;margin-top:14px;padding-top:12px;border-top:0.5px solid #F2F2F7;line-height:1.5}

/* Toasts */
.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>

<body>
<div class="hdr">
  <div class="hdr-top">
    <img class="hdr-logo" src="mister_lasagna_logo.svg" alt="Mister Lasagna">
    <div class="hdr-text"><div class="hdr-title">Mister Lasagna</div><div class="hdr-sub">Leicester Square</div></div>
    <div class="hdr-zoom" role="group" aria-label="Dimensione testo">
      <button data-z="s" onclick="setZoom('s')">A</button>
      <button data-z="m" onclick="setZoom('m')" class="on">A</button>
      <button data-z="l" onclick="setZoom('l')">A</button>
    </div>
    <button class="hdr-info" onclick="openHelp()" title="Aiuto" aria-label="Aiuto">ⓘ</button>
  </div>
  <div class="hdr-tabs">
    <button class="htab active" onclick="setView('stock',this)">📋 Stock Check</button>
    <button class="htab" onclick="setView('sup',this)">🚚 Fornitori</button>
  </div>
</div>
<div id="main"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>

// STATO — Persiste in localStorage. Reset = svuota.
// stock[id] = numero (stock rimanente). undefined = vuoto/non controllato.
// ═══════════════════════════════════════════════════════════════════
var state = {
  stock:{},          // per item con MIN>0 → stock rimanente
  order:{},          // per item con MIN=0 → {on:bool, qty:number}
  view:'stock',      // 'stock' | 'sup' | 'sup:<id>'
  zoom:'m',
  helpOpen:false,
  helpLang:'it'
};

function loadState(){
  try{
    var s=localStorage.getItem('ml_stock');if(s)state.stock=JSON.parse(s)||{};
    var o=localStorage.getItem('ml_order');if(o)state.order=JSON.parse(o)||{};
    var z=localStorage.getItem('ml_zoom');if(z)state.zoom=z;
    var l=localStorage.getItem('ml_help_lang');if(l)state.helpLang=l;
  }catch(e){state.stock={};state.order={};}
  document.documentElement.setAttribute('data-zoom',state.zoom);
  document.querySelectorAll('.hdr-zoom button').forEach(function(b){b.classList.toggle('on',b.dataset.z===state.zoom);});
}
function saveStock(){try{localStorage.setItem('ml_stock',JSON.stringify(state.stock));}catch(e){}}
function saveOrder(){try{localStorage.setItem('ml_order',JSON.stringify(state.order));}catch(e){}}
function setZoom(z){state.zoom=z;document.documentElement.setAttribute('data-zoom',z);try{localStorage.setItem('ml_zoom',z);}catch(e){}document.querySelectorAll('.hdr-zoom button').forEach(function(b){b.classList.toggle('on',b.dataset.z===z);});}

function getStock(id){var v=state.stock[id];return (v===undefined||v===null||v==='')?null:Number(v);}
function getOrderState(id){var o=state.order[id];return o||{on:false,qty:0};}
function getOrder(id){
  var min=ALL_ITEMS[id].min;
  // Item con MIN=0 → modalità free order: solo se on, ritorna qty
  if(min===0){var o=getOrderState(id);return o.on?Math.max(0,o.qty||0):0;}
  // Item con MIN>0 → modalità stock check: MIN − stock
  var st=getStock(id);
  if(st===null)return 0;
  return Math.max(0,min-st);
}

function onStockInput(id,val,el){
  if(val===''||val==null){delete state.stock[id];}
  else{
    var n=parseInt(val,10);
    if(isNaN(n)||n<0)n=0;
    state.stock[id]=n;
  }
  saveStock();
  // Update live tutte le occorrenze di questo item (sincronia drinks core)
  document.querySelectorAll('[data-stock-input="'+id+'"]').forEach(function(inp){if(inp!==el)inp.value=state.stock[id]==null?'':state.stock[id];});
  // Update "da ordinare" celle
  var ord=getOrder(id);
  var prevOrd=el.getAttribute('data-prev-ord');
  document.querySelectorAll('[data-ord="'+id+'"]').forEach(function(cell){
    cell.textContent=ord;
    cell.classList.toggle('zero',ord===0);
    // flash se passa da 0 a >0
    if(ord>0 && prevOrd==='0'){cell.classList.add('hot');setTimeout(function(){cell.classList.remove('hot');},800);}
  });
  el.setAttribute('data-prev-ord',String(ord));
  // Update tutti i totali / contatori sezione
  updateAllCounters();
}

function updateAllCounters(){
  // Totale Stock Check
  var totSC=0;
  ['lasagne','pasta','topping','arancini','acqua','pellegrino'].forEach(function(gid){
    var g=STOCK_GROUPS.find(function(x){return x.id===gid;});
    g.items.forEach(function(it){if(getOrder(it.id)>0)totSC++;});
  });
  var foot=document.getElementById('sc-footer-count');
  if(foot){foot.textContent=totSC;foot.classList.toggle('zero',totSC===0);}
  // Contatori action bar WhatsApp
  updateActionBar();
  // Contatori fornitori (vista lista)
  SUPPLIERS.forEach(function(sup){
    var c=0;sup.itemIds.forEach(function(id){if(getOrder(id)>0)c++;});
    var el=document.getElementById('sup-cnt-'+sup.id);
    if(el){
      el.innerHTML=c+'<small>'+(c===1?'item':'items')+'</small>';
      el.classList.toggle('zero',c===0);
      el.classList.toggle('hot',c>0);
    }
  });
}

function resetAll(){
  if(!confirm('Cancellare tutti i valori inseriti?\n(Stock e quantità da ordinare saranno azzerati.)'))return;
  state.stock={};state.order={};saveStock();saveOrder();render();showToast('Tutto azzerato');
}

function onToggleOrder(id,el){
  var o=getOrderState(id);
  o.on=!o.on;
  if(!o.qty)o.qty=1; // primo tap: quantità di default 1
  state.order[id]=o;saveOrder();
  // Live re-render della singola riga
  var row=el.closest('.sc-row');
  if(row)row.classList.toggle('off',!o.on);
  // Sincronizza tutte le occorrenze
  document.querySelectorAll('[data-toggle-order="'+id+'"]').forEach(function(inp){if(inp!==el)inp.checked=o.on;});
  document.querySelectorAll('[data-toggle-order="'+id+'"]').forEach(function(inp){var r=inp.closest('.sc-row');if(r)r.classList.toggle('off',!o.on);});
  document.querySelectorAll('[data-qty-val="'+id+'"]').forEach(function(v){v.textContent=o.qty;v.classList.toggle('zero',o.qty===0);});
  updateAllCounters();
}
function onQtyChange(id,delta){
  var o=getOrderState(id);
  if(!o.on){o.on=true;o.qty=Math.max(0,(o.qty||0)+delta);}
  else{o.qty=Math.max(0,(o.qty||0)+delta);}
  if(o.qty===0)o.on=false;
  state.order[id]=o;saveOrder();
  document.querySelectorAll('[data-qty-val="'+id+'"]').forEach(function(v){v.textContent=o.qty;v.classList.toggle('zero',o.qty===0);});
  document.querySelectorAll('[data-toggle-order="'+id+'"]').forEach(function(inp){inp.checked=o.on;var r=inp.closest('.sc-row');if(r)r.classList.toggle('off',!o.on);});
  updateAllCounters();
}

function formatDate(){
  var d=new Date();
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var yy=d.getFullYear();
  return dd+'/'+mm+'/'+yy;
}

function buildMsg(opts){
  // opts: {title, groups:[{name,icon,ids:[]}], footer}
  var lines=[];
  lines.push(opts.title);
  lines.push('📅 '+formatDate()+' · Mister Lasagna Leicester Sq');
  lines.push('');
  var totItems=0,totQty=0;
  opts.groups.forEach(function(g){
    var ords=g.ids.map(function(id){return {id:id,n:getOrder(id),it:ALL_ITEMS[id]};}).filter(function(x){return x.n>0;});
    if(!ords.length)return;
    lines.push(g.icon+' '+g.name.toUpperCase());
    ords.forEach(function(x){
      lines.push('• '+x.it.name+' — '+x.n);
      totItems++;totQty+=x.n;
    });
    lines.push('');
  });
  if(totItems===0)return null;
  lines.push('Totale: '+totItems+(totItems===1?' articolo':' articoli')+' · '+totQty+' pz');
  return lines.join('\n');
}

function sendMsg(msg){
  if(!msg){showToast('Nessun articolo da ordinare');return;}
  var url='https://wa.me/?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
}
function copyMsg(msg){
  if(!msg){showToast('Nessun articolo da ordinare');return;}
  navigator.clipboard.writeText(msg).then(function(){showToast('Copiato negli appunti');},function(){alert('Copia non riuscita.');});
}

function rowHtml(item,zebra){
  var min=item.min;
  // Modalità free order (MIN=0): toggle + stepper
  if(min===0){
    var o=getOrderState(item.id);
    return '<div class="sc-row free'+(zebra?' zebra':'')+(!o.on?' off':'')+'">'
      +'<label class="sw"><input type="checkbox" data-toggle-order="'+item.id+'" '+(o.on?'checked':'')+' onchange="onToggleOrder(\''+item.id+'\',this)"><span class="sw-t"></span><span class="sw-k"></span></label>'
      +'<div class="sc-name">'+escapeHtml(item.name)+'</div>'
      +'<div class="qty">'
      +'<button class="dec" '+(o.qty<=0?'disabled':'')+' onclick="onQtyChange(\''+item.id+'\',-1)">−</button>'
      +'<div class="qv'+(o.qty===0?' zero':'')+'" data-qty-val="'+item.id+'">'+o.qty+'</div>'
      +'<button class="inc" onclick="onQtyChange(\''+item.id+'\',1)">+</button>'
      +'</div>'
      +'</div>';
  }
  // Modalità stock check classica (MIN>0)
  var st=state.stock[item.id];
  var ord=getOrder(item.id);
  return '<div class="sc-row'+(zebra?' zebra':'')+'">'
    +'<div class="sc-name">'+escapeHtml(item.name)+'</div>'
    +'<div class="sc-min">'+min+'</div>'
    +'<div class="sc-stock-cell"><input type="number" inputmode="numeric" min="0" placeholder="—" data-stock-input="'+item.id+'" data-prev-ord="'+ord+'" value="'+(st==null?'':st)+'" oninput="onStockInput(\''+item.id+'\',this.value,this)"></div>'
    +'<div class="sc-ord'+(ord===0?' zero':'')+'" data-ord="'+item.id+'">'+ord+'</div>'
    +'</div>';
}

function renderHelp(){
  if(!state.helpOpen)return'';
  var isIt=state.helpLang==='it';
  var t=isIt?{
    title:'Come usare l\'app',
    s1:{n:'1',h:'Conta lo stock',b:'Per i prodotti con MIN inserisci nella casella arancione <b>quanti pezzi sono rimasti</b>. L\'app calcola da sola quanti ne servono (MIN − stock).<br><br>Per i prodotti <b>senza MIN</b> (es. Donovan packaging, Coca Cola, birre): attiva il toggle ✅ e usa <b>− / +</b> per la quantità.'},
    s2:{n:'2',h:'Cucine vs Drinks',b:'<b>Lasagne, pasta, toppings, arancini</b> arrivano dalle cucine NH/Chelsea → pulsante <b>📱 Cucine</b>.<br><b>Acqua e S.Pellegrino</b> li ordini dai fornitori → pulsante <b>📱 Drinks</b>.'},
    s3:{n:'3',h:'WhatsApp',b:'Premi il pulsante verde → si apre WhatsApp con il <b>messaggio pronto</b> e ti chiede a chi mandarlo. Scegli dalla rubrica (NH, Chelsea, Casa Julia, Zaino…).'},
    s4:{n:'4',h:'Fornitori',b:'Nel tab <b>🚚 Fornitori</b> trovi Casa Julia, Zaino e Donovan. Apri uno e inserisci lo stock come nel tab principale.'},
    s5:{n:'5',h:'Casa Julia o Zaino?',b:'Per le bevande ordina sempre da <b>Casa Julia</b>. Se qualcosa è out of stock, vai sul tab Zaino e ordinalo da lì.'},
    box:{h:'💾 I numeri restano salvati',b:'Lo stock inserito resta in memoria finché non premi <b>↻ Reset</b>. Puoi chiudere e riaprire l\'app senza perdere niente.'},
    sign:'Dubbi? Scrivi a Luigi 👍'
  }:{
    title:'How to use the app',
    s1:{n:'1',h:'Count the stock',b:'For items with MIN, type in the orange box <b>how many pieces are left</b>. The app calculates how many you need (MIN − stock).<br><br>For items <b>without MIN</b> (e.g. Donovan packaging, Coca Cola, beers): switch on the toggle ✅ and use <b>− / +</b> for the quantity.'},
    s2:{n:'2',h:'Kitchens vs Drinks',b:'<b>Lasagne, pasta, toppings, arancini</b> come from NH/Chelsea kitchens → <b>📱 Kitchens</b> button.<br><b>Water and S.Pellegrino</b> are ordered from suppliers → <b>📱 Drinks</b> button.'},
    s3:{n:'3',h:'WhatsApp',b:'Tap the green button → WhatsApp opens with the <b>message ready</b> and asks who to send it to. Pick from contacts (NH, Chelsea, Casa Julia, Zaino…).'},
    s4:{n:'4',h:'Suppliers',b:'In the <b>🚚 Suppliers</b> tab you have Casa Julia, Zaino and Donovan. Open one and enter the stock like in the main tab.'},
    s5:{n:'5',h:'Casa Julia or Zaino?',b:'For drinks always order from <b>Casa Julia</b>. If something is out of stock, go to Zaino and order it from there.'},
    box:{h:'💾 Numbers stay saved',b:'The stock you entered stays in memory until you press <b>↻ Reset</b>. You can close and reopen the app without losing anything.'},
    sign:'Questions? Text Luigi 👍'
  };
  function sec(s){return '<div class="guide-step"><div class="guide-n">'+s.n+'</div><div style="flex:1;min-width:0"><div class="guide-h">'+s.h+'</div><div class="guide-b">'+s.b+'</div></div></div>';}
  var h='<div class="ovl" onclick="if(event.target===this)closeHelp()"><div class="mdl">';
  h+='<div class="mdl-hd"><span class="mdl-title">📖 '+t.title+'</span>';
  h+='<button class="lang-btn '+(isIt?'on':'off')+'" onclick="setHelpLang(\'it\')">IT</button>';
  h+='<button class="lang-btn '+(!isIt?'on':'off')+'" onclick="setHelpLang(\'en\')">EN</button>';
  h+='<button class="btn-x" onclick="closeHelp()">×</button></div>';
  h+=sec(t.s1)+sec(t.s2)+sec(t.s3)+sec(t.s4)+sec(t.s5);
  h+='<div class="guide-box"><div class="guide-box-h">'+t.box.h+'</div><div class="guide-box-b">'+t.box.b+'</div></div>';
  h+='<div class="guide-sign">'+t.sign+'</div>';
  h+='</div></div>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════════════════
function showToast(msg){
  var root=document.getElementById('toast-root');
  root.innerHTML='<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(function(){if(root)root.innerHTML='';},1600);
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function renderModal(){document.getElementById('modal-root').innerHTML=renderHelp();}

function render(){
  var main='';
  if(state.view==='stock')main=renderStockCheck();
  else if(state.view==='sup')main=renderSupplierList();
  else if(state.view.indexOf('sup:')===0)main=renderSupplierDetail(state.view.slice(4));
  document.getElementById('main').innerHTML=main;
  renderModal();
}

loadState();
render();
</script>
