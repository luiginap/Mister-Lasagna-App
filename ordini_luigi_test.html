<title>Ordini — Lasagneria Italiana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F2F7;color:#1C1C1E;max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20;border-bottom:0.5px solid #C6C6C8}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hdr h1{font-size:17px;font-weight:700}
.hdr-tabs{display:flex}
.htab{flex:1;padding:9px 0;font-size:14px;font-weight:500;text-align:center;cursor:pointer;color:#8E8E93;border:none;border-bottom:2px solid transparent;background:none}
.htab.active{color:#185FA5;border-bottom-color:#185FA5}
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 4px}
.loc-btn{padding:11px;border-radius:12px;border:1.5px solid #D1D1D6;background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:#8E8E93;text-align:center}
.loc-btn.nh.on{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.loc-btn.ch.on{background:#EAF3DE;border-color:#3B6D11;color:#27500A}
.banner{margin:8px 16px;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.4}
.banner.nh{background:#E6F1FB;color:#0C447C}.banner.ch{background:#EAF3DE;color:#27500A}
.cards{padding:0 16px 100px}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.chd{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:58px}
.chd:active{background:#F9F9F9}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chd-info{flex:1;min-width:0}
.sname{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sfreq{font-size:12px;color:#8E8E93;margin-top:2px}
.xbadge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;background:#FFECEC;color:#C00}
.abadge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;background:#EAF3DE;color:#1A7D2E}
.chev{font-size:16px;color:#C7C7CC;flex-shrink:0;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.cbody{border-top:0.5px solid #F2F2F7}
.cinfo{padding:8px 16px;font-size:12px;color:#8E8E93;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.cnote{padding:8px 16px;font-size:12px;color:#7A4800;background:#FFF8EC;border-bottom:0.5px solid #FFEFD1}
.sec-lbl{padding:10px 16px 4px;font-size:11px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.06em;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.item-row{display:flex;align-items:center;padding:9px 16px;border-bottom:0.5px solid #F2F2F7;gap:10px;min-height:48px}
.item-row.excl{opacity:.5;background:#FAFAFA}
.item-row.xrow{background:#FFFDF5;min-height:42px;padding:7px 16px}
.sw{width:44px;height:26px;position:relative;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-t{position:absolute;inset:0;border-radius:13px;background:#D1D1D6;transition:background .2s}
.sw input:checked~.sw-t{background:#30D158}
.sw-k{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked~.sw-k{transform:translateX(18px)}
.iinfo{flex:1;min-width:0}
.iname{font-size:14px;font-weight:500;line-height:1.3}
.iname.off{text-decoration:line-through;color:#8E8E93}
.iname.sm{font-size:13px;font-weight:400}
.imeta{font-size:11px;color:#AEAEB2;margin-top:2px;display:flex;align-items:center;gap:6px}
.sug{font-size:10px;background:#E6F1FB;color:#185FA5;padding:1px 6px;border-radius:6px;cursor:pointer;font-weight:600}
.stepper{display:flex;align-items:center;flex-shrink:0}
.stb{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;flex-shrink:0}
.stb:active{background:#E5E5EA}.stb.dec{color:#FF3B30}.stb.inc{color:#30D158}
.stb.sm{width:26px;height:26px;font-size:16px}
.stv{width:40px;text-align:center;font-size:15px;font-weight:700}
.stv.na{color:#C7C7CC;font-weight:400;font-size:13px}.stv.sm{width:34px;font-size:14px}
.iunit{font-size:11px;color:#AEAEB2;width:30px;text-align:right;flex-shrink:0}
.cat-div{padding:5px 16px;font-size:10px;font-weight:700;color:#B07700;text-transform:uppercase;letter-spacing:.06em;background:#FFFDF5;border-bottom:0.5px solid #FFF0CC}
.xbtn{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#FFFBF0;border-top:0.5px solid #FFF0CC;cursor:pointer;font-size:13px;font-weight:600;color:#854F0B}
.xbtn:active{background:#FFF0CC}
.actions{padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:0.5px solid #F2F2F7;background:#FAFAFA}
.btn-rst{padding:9px 10px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#8E8E93;white-space:nowrap}
.btn-imp{padding:9px 10px;border-radius:10px;border:1.5px solid #EF9F27;background:#FAEEDA;font-size:12px;font-weight:600;cursor:pointer;color:#633806;white-space:nowrap}
.btn-cpy{flex:1;padding:11px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1C1C1E;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-cpy.ok{border-color:#30D158;color:#1A7D2E;background:#EAF3DE}
.btn-wa{flex:1;padding:11px;border-radius:10px;border:none;background:#25D366;font-size:13px;font-weight:600;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px}
/* Modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:100}
.mdl{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px 40px}
.mdl-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mdl-title{font-size:16px;font-weight:700}
.btn-x{width:32px;height:32px;border-radius:50%;border:none;background:#F2F2F7;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8E8E93}
.ta{width:100%;height:140px;padding:10px;border:1px solid #D1D1D6;border-radius:12px;font-size:12px;font-family:monospace;resize:none;background:#FAFAFA}
.ta:focus{outline:none;border-color:#185FA5}
.parse-info{padding:10px 12px;background:#E6F1FB;border-radius:10px;font-size:13px;color:#0C447C;margin:10px 0}
.parse-list{margin:10px 0;max-height:220px;overflow-y:auto;border:1px solid #E5E5E5;border-radius:10px}
.parse-row{display:grid;grid-template-columns:44px 50px 1fr;gap:4px;padding:7px 12px;border-bottom:0.5px solid #F2F2F7;font-size:13px;align-items:center}
.parse-row:last-child{border-bottom:none}
.parse-row.new{background:#FFF8EC}
.btn-analyze{width:100%;padding:13px;border-radius:12px;border:none;background:#185FA5;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-analyze:active{background:#0C447C}
.btn-analyze:disabled{background:#C7C7CC;cursor:default}
.btn-confirm{width:100%;padding:13px;border-radius:12px;border:none;background:#30D158;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-confirm:active{background:#25A244}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hist-row{padding:8px 12px;border-bottom:0.5px solid #F2F2F7;font-size:12px;color:#3A3A3C}
.hist-row:last-child{border-bottom:none}
/* Import — image upload */
.imp-tabs{display:flex;gap:6px;margin-bottom:10px;background:#F2F2F7;border-radius:10px;padding:3px}
.imp-tab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;border:none;background:none;color:#8E8E93;border-radius:8px;cursor:pointer}
.imp-tab.on{background:#fff;color:#185FA5;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:2px dashed #C7C7CC;border-radius:12px;padding:18px 12px;text-align:center;background:#FAFAFA;transition:all .15s;cursor:pointer}
.drop.hover{border-color:#185FA5;background:#E6F1FB}
.drop-ico{font-size:32px;margin-bottom:4px}
.drop-t{font-size:14px;font-weight:600;color:#1C1C1E}
.drop-s{font-size:11px;color:#8E8E93;margin-top:3px;line-height:1.4}
.cam-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cam-btn{padding:11px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1C1C1E;display:flex;align-items:center;justify-content:center;gap:6px}
.cam-btn:active{background:#F2F2F7}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;border:1.5px solid #E5E5E5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.thumb-n{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:10px;padding:8px 4px 3px;text-align:center;font-weight:600}
.parse-row.edit{display:grid;grid-template-columns:44px 50px 1fr auto;gap:4px;padding:6px 8px;border-bottom:0.5px solid #F2F2F7;align-items:center}
.parse-row.edit input,.parse-row.edit select{font-size:13px;padding:5px 6px;border:1px solid #D1D1D6;border-radius:6px;background:#fff;width:100%;min-width:0}
.parse-row.edit .rm{width:24px;height:24px;border-radius:50%;border:none;background:#FFECEC;color:#C00;font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.match-pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#EAF3DE;color:#1A7D2E;font-weight:600;margin-left:4px}
.match-pill.new{background:#FFF8EC;color:#854F0B}
.match-pill.man{background:#E6F1FB;color:#185FA5}
.hist-box{padding:0 16px;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.hist-list{padding:6px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hist-chip{flex-shrink:0;padding:5px 9px;border-radius:14px;background:#fff;border:1px solid #E5E5E5;font-size:11px;color:#3A3A3C;display:flex;align-items:center;gap:4px;cursor:pointer}
.hist-chip:active{background:#F2F2F7}
.hist-chip .n{font-weight:700;color:#185FA5}
.hist-chip .del{margin-left:2px;color:#C7C7CC;font-size:13px}
.help-toggle{font-size:11px;color:#185FA5;cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
/* Status */
.sc{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.sr{display:flex;align-items:center;padding:11px 16px;border-bottom:0.5px solid #F2F2F7;gap:10px}
.sr:last-child{border-bottom:none}
.sbg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;flex-shrink:0}
.ok{background:#EAF3DE;color:#1A7D2E}.warn{background:#FFF8EC;color:#7A4800}
</style>

</head>

function loadOS(){try{var s=localStorage.getItem('ml_v5');if(s)OS=JSON.parse(s);}catch(e){}}

function getPar(sup,prod){return loc==='NH'?prod.parNH:prod.parCH;}
function getState(sid,pid,par){var ov=(OS.overrides[loc][sid]||{})[pid];return ov!=null?ov:{qty:par,on:par>0};}
function setState(sid,pid,par,u){
  if(!OS.overrides[loc][sid])OS.overrides[loc][sid]={};
  OS.overrides[loc][sid][pid]=Object.assign({},getState(sid,pid,par),u);
  saveOS();render();
}
function resetSup(sid){OS.overrides[loc][sid]={};saveOS();render();}

function getSuggested(sid,pid){
  var h=(OS.history[loc][sid]||[]);
  if(h.length<3)return null;
  var dates=h.map(function(inv){var p=inv.date.split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0;}).filter(function(d){return d>0;});
  if(dates.length<2)return null;
  var days=Math.max(1,(Math.max.apply(null,dates)-Math.min.apply(null,dates))/86400000+1);
  var total=h.reduce(function(s,inv){return s+(inv.items[pid]||0);},0);
  return Math.round(total/days*7*10)/10;
}

function parseAllGreens(text){
  var dateM=text.match(/Invoice Date\s+(\d{2}\/\d{2}\/\d{4})/);
  var invM=text.match(/Invoice\s+(\d{5,})/);
  var locD=text.match(/Notting Hill/i)?'NH':text.match(/Chelsea/i)?'Chelsea':null;
  var items=[];
  text.split('\n').forEach(function(line){
    var m=line.trim().match(/^([\d.]+)\s+(Kilo|Each)\s+(.+?)\s+([\d.]+)\s+([\d.]+)\s+\d+\s+(\d+)\s*$/);
    if(m){items.push({qty:parseFloat(m[1]),unit:m[2]==='Kilo'?'kg':'pz',name:m[3].trim(),code:m[6]});}
  });
  return{supplier:'All Greens',date:dateM?dateM[1]:null,invNum:invM?invM[1]:null,locD:locD,items:items,src:'regex'};
}

async function parseWithClaude(text,images,supName){
  var key=localStorage.getItem('ml_apikey')||'';
  if(!key){
    // Fallback all'helper interno se disponibile (artifact context)
    if(window.claude&&window.claude.complete){
      return await parseWithClaudeHelper(text,images,supName);
    }
    throw new Error('Chiave API mancante. Tocca 🔑 sopra per inserirla.');
  }
  var content=[];
  (images||[]).forEach(function(img){
    content.push({type:'image',source:{type:'base64',media_type:img.type,data:img.data}});
  });
  var prompt='Parse this '+supName+' supplier invoice'+(images&&images.length?' from the image'+(images.length>1?'s (multiple pages of the same invoice)':''):'')+'. Return ONLY valid JSON, no markdown.\n\n'+(text?'Invoice text:\n'+text+'\n\n':'')+'Return JSON: {"supplier":"name","date":"DD/MM/YYYY or null","invNum":"xxxx or null","locD":"NH or Chelsea or null","items":[{"qty":number,"unit":"kg or pz or box or case or bt or bag or casse or cassa or bot","name":"exact product name as written"}]}\n\nRules:\n- qty MUST be a number (not string)\n- if the same product appears twice, sum quantities\n- skip delivery/discount/total rows\n- locD: detect from delivery address (Notting Hill=NH, Chelsea=Chelsea)';
  content.push({type:'text',text:prompt});
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,
      messages:[{role:'user',content:content}]})
  });
  if(!r.ok){
    var txt=await r.text();
    if(r.status===401||r.status===403)throw new Error('Chiave API non valida o scaduta. Tocca 🔑 per aggiornarla.');
    throw new Error('API '+r.status+': '+txt.substring(0,200));
  }
  var d=await r.json();
  var raw=d.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('');
  var clean=raw.replace(/```json\n?|```/g,'').trim();
  var jm=clean.match(/\{[\s\S]*\}/);if(jm)clean=jm[0];
  return Object.assign(JSON.parse(clean),{src:images&&images.length?'vision':'claude'});
}

async function parseWithClaudeHelper(text,images,supName){
  // Fallback usando window.claude.complete (solo nel contesto artifact, limite token basso)
  var content=[];
  (images||[]).forEach(function(img){
    content.push({type:'image',source:{type:'base64',media_type:img.type,data:img.data}});
  });
  content.push({type:'text',text:'Parse this '+supName+' invoice. Return ONLY valid JSON:\n'+(text||'')+'\n{"supplier":"name","date":"DD/MM/YYYY or null","invNum":"xxxx or null","locD":"NH or Chelsea or null","items":[{"qty":number,"unit":"kg/pz/box/case","name":"product name"}]}'});
  var raw=await window.claude.complete({messages:[{role:'user',content:content}]});
  var clean=String(raw).replace(/```json\n?|```/g,'').trim();
  var jm=clean.match(/\{[\s\S]*\}/);if(jm)clean=jm[0];
  return Object.assign(JSON.parse(clean),{src:'helper'});
}

function setApiKey(){
  var cur=localStorage.getItem('ml_apikey')||'';
  var k=prompt('Incolla la tua chiave API Anthropic (inizia con sk-ant-...).\nViene salvata SOLO nel tuo browser (localStorage). Lascia vuoto per rimuovere.',cur);
  if(k===null)return;
  k=k.trim();
  if(!k){localStorage.removeItem('ml_apikey');alert('Chiave rimossa.');}
  else if(!/^sk-ant-/.test(k)){alert('Formato chiave non valido (deve iniziare con sk-ant-).');return;}
  else{localStorage.setItem('ml_apikey',k);alert('Chiave salvata.');}
  render();
}

// Read a File/Blob → {type, data: base64 (no prefix), preview: dataURL, name}
function readImage(file){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      var url=rd.result;
      var b64=url.split(',')[1];
      var mt=(url.match(/^data:([^;]+);/)||[])[1]||'image/jpeg';
      // downscale if very large to keep payload small
      var img=new Image();
      img.onload=function(){
        var max=1600,w=img.width,h=img.height;
        if(Math.max(w,h)>max){var s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);
          var c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          var dataURL=c.toDataURL('image/jpeg',0.85);
          res({type:'image/jpeg',data:dataURL.split(',')[1],preview:dataURL,name:file.name});
        }else{res({type:mt,data:b64,preview:url,name:file.name});}
      };
      img.onerror=function(){res({type:mt,data:b64,preview:url,name:file.name});};
      img.src=url;
    };
    rd.onerror=rej;rd.readAsDataURL(file);
  });
}

async function addImages(files){
  var arr=Array.from(files||[]).filter(function(f){return f&&f.type&&f.type.indexOf('image/')===0;});
  for(var i=0;i<arr.length;i++){var im=await readImage(arr[i]);impImages.push(im);render();}
}
function removeImage(i){impImages.splice(i,1);render();}

function matchProduct(sup,item){
  // Try to match by prodCode (All Greens)
  var codeMap={1257:'aub',15018:'coug',33076:'spin',37001:'tvine',5057:'chmush',33081:'cel',
    15078:'ched',23003:'milk',5065:'carr',4059:'broc',26031:'onr',26038:'ong',22004:'lem',
    4075:'leaf',18006:'lett',31021:'rock',23080:'mint',5100:'tcpv',5070:'tcv',1674:'pump',
    22008:'lime',26006:'oj',28088:'bpot',31020:'bpep',5001:'dcream',28104:'potato-w',
    33021:'sage',4062:'basil',1110:'avo',22013:'cuc',11011:'eggs',11253:'pump2'};
  if(item.code&&codeMap[parseInt(item.code)]){
    var pid=codeMap[parseInt(item.code)];
    var found=sup.products.find(function(p){return p.id===pid;});
    if(found)return found;
  }
  // Fuzzy name match: token overlap weighted by length + number/unit match
  function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  var stop={'the':1,'and':1,'with':1,'for':1,'pack':1,'each':1,'kilo':1,'fresh':1,'di':1,'da':1,'a':1,'la':1,'il':1,'lo':1,'gr':1,'kg':1,'ml':1,'cl':1,'pz':1};
  var nl=norm(item.name);
  var nTok=nl.split(' ').filter(function(w){return w.length>2&&!stop[w];});
  var nNums=nl.match(/\d+/g)||[];
  var best=null,bestScore=0;
  sup.products.forEach(function(p){
    var pn=norm(p.name);
    var pTok=pn.split(' ').filter(function(w){return w.length>2&&!stop[w];});
    var score=0;
    nTok.forEach(function(w){if(pTok.indexOf(w)>=0)score+=Math.min(w.length,8);});
    // bonus if a number (e.g. weight/pack size) matches
    var pNums=pn.match(/\d+/g)||[];
    nNums.forEach(function(n){if(pNums.indexOf(n)>=0)score+=3;});
    if(score>bestScore){bestScore=score;best=p;}
  });
  return bestScore>=4?best:null;
}

// ── Render helpers ───────────────────────────────────────
function stp(sid,pid,par,unit,dir){
  var st=getState(sid,pid,par);
  var s=unit==='kg'?0.5:1;
  var q=Math.max(0,Math.round((st.qty+dir*s)*10)/10);
  setState(sid,pid,par,{qty:q,on:q>0});
}
function acceptSug(sid,pid,par,sugVal){setState(sid,pid,par,{qty:sugVal,on:sugVal>0});}

function rItem(sup,prod,isX){
  var par=getPar(sup,prod);
  var st=getState(sup.id,prod.id,par);
  var on=st.on!==false,qty=st.qty;
  var sm=isX?' sm':'';
  var h='<div class="item-row'+(on?'':' excl')+(isX?' xrow':'')+'">';
  h+='<label class="sw"><input type="checkbox"'+(on?' checked':'')+' onchange="setState(\''+sup.id+'\',\''+prod.id+'\','+par+',{on:this.checked,qty:this.checked?'+(par>0?par:1)+':0});"><span class="sw-t"></span><span class="sw-k"></span></label>';
  h+='<div class="iinfo"><div class="iname'+(on?'':' off')+(isX?' sm':'')+'">'+prod.name+'</div>';
  if(!isX){
    var sug=getSuggested(sup.id,prod.id);
    h+='<div class="imeta">par: '+par;
    if(sug!==null&&Math.abs(sug-par)>0.4)h+=' <span class="sug" onclick="acceptSug(\''+sup.id+'\',\''+prod.id+'\','+par+','+sug+')">\ud83d\udca1 suggerito: '+sug+'</span>';
    h+='</div>';
  }
  h+='</div>';
  if(on){
    h+='<div class="stepper"><button class="stb dec'+sm+'" onclick="stp(\''+sup.id+'\',\''+prod.id+'\','+par+',\''+prod.unit+'\',-1)">\u2212</button>';
    h+='<span class="stv'+sm+'">'+qty+'</span>';
    h+='<button class="stb inc'+sm+'" onclick="stp(\''+sup.id+'\',\''+prod.id+'\','+par+',\''+prod.unit+'\',1)">+</button></div>';
  }else h+='<span class="stv na">\u2014</span>';
  return h+'<span class="iunit">'+prod.unit+'</span></div>';
}

function genMsg(sup){
  var lines=[];
  sup.products.forEach(function(prod){
    var par=getPar(sup,prod);
    var st=getState(sup.id,prod.id,par);
    if(!st.on||st.qty<=0)return;
    lines.push(' '+String(st.qty).padStart(2)+' '+prod.unit.padEnd(6)+'  '+prod.name);
  });
  return'Ciao! Ordine '+sup.name+' \u2014 '+loc+':\n\n'+lines.join('\n')+'\n\nGrazie!';
}

function cpyMsg(sid){
  var sup=SUPS.find(function(s){return s.id===sid;});if(!sup)return;
  var msg=genMsg(sup);
  function ok(){copiedSup=sid;render();setTimeout(function(){copiedSup=null;render();},2500);}
  if(navigator.clipboard)navigator.clipboard.writeText(msg).then(ok).catch(ok);
  else{var t=document.createElement('textarea');t.value=msg;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');document.body.removeChild(t);ok();}
}
function waMsg(sid){
  var sup=SUPS.find(function(s){return s.id===sid;});if(!sup)return;
  var msg=genMsg(sup);
  // Pre-copia negli appunti (fallback se l'utente perde il testo nel passaggio)
  try{if(navigator.clipboard)navigator.clipboard.writeText(msg);}catch(e){}
  // Apri WhatsApp SENZA destinatario preimpostato → l'utente sceglie il contatto
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function openImport(sid){impSup=sid;impStep='idle';impMode='img';impText='';impImages=[];impResult=null;impErr=null;render();}
function closeImport(){impSup=null;impImages=[];impText='';impResult=null;render();}
function setImpMode(m){impMode=m;render();}

async function analyzeInvoice(){
  var hasImg=impImages.length>0,hasTxt=impText.trim().length>0;
  if(!hasImg&&!hasTxt)return;
  impStep='parsing';impErr=null;render();
  try{
    var sup=SUPS.find(function(s){return s.id===impSup;});
    var result;
    // Pure text + All Greens → fast regex path
    if(!hasImg&&(sup.parseType==='allgreens'||/All Greens|allgreens|New Covent/i.test(impText))){
      result=parseAllGreens(impText);
    }else{
      result=await parseWithClaude(hasTxt?impText:'',hasImg?impImages:null,sup.name);
    }
    // Normalize: coerce qty numbers, drop empties
    result.items=(result.items||[]).filter(function(it){return it&&it.name;}).map(function(it){
      it.qty=parseFloat(it.qty)||0;
      it.unit=(it.unit||'pz').toLowerCase();
      return it;
    }).filter(function(it){return it.qty>0;});
    // Match each item
    result.items.forEach(function(it){it.matched=matchProduct(sup,it);it.manual=false;});
    impResult=result;impStep='done';
  }catch(e){impStep='error';impErr=e.message||String(e);}
  render();
}

// Edit a parsed item field
function editItem(i,k,v){
  if(!impResult)return;
  var it=impResult.items[i];if(!it)return;
  if(k==='qty')it.qty=parseFloat(v)||0;
  else if(k==='unit')it.unit=v;
  else if(k==='name')it.name=v;
  else if(k==='match'){
    if(v==='__new__'){it.matched=null;it.manual=false;}
    else{var sup=SUPS.find(function(s){return s.id===impSup;});
      it.matched=sup.products.find(function(p){return p.id===v;})||null;it.manual=true;}
  }
  render();
}
function removeParsedItem(i){if(!impResult)return;impResult.items.splice(i,1);render();}

function confirmImport(){
  if(!impResult||!impResult.items)return;
  var sup=SUPS.find(function(s){return s.id===impSup;});
  var l=impResult.locD||loc;
  if(!OS.history[l][sup.id])OS.history[l][sup.id]=[];
  var items={};
  impResult.items.forEach(function(it){
    if(it.qty<=0)return;
    var pid;
    if(it.matched){pid=it.matched.id;}
    else{
      // new product → stable id from name
      pid=it.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').substring(0,28);
      var exists=sup.products.find(function(p){return p.id===pid;});
      if(!exists){sup.products.push({id:pid,name:it.name,unit:it.unit||'pz',parNH:0,parCH:0,cat:'Da fattura'});}
    }
    items[pid]=(items[pid]||0)+it.qty;
  });
  OS.history[l][sup.id].push({
    date:impResult.date||new Date().toLocaleDateString('it-IT'),
    invNum:impResult.invNum||null,
    items:items
  });
  var h=OS.history[l][sup.id];
  if(h.length>30)OS.history[l][sup.id]=h.slice(-30);
  saveOS();closeImport();
}

  var arr=OS.history[loc][sid]||[];arr.splice(idx,1);saveOS();render();

        h+='<select style="margin-top:3px;font-size:11px;padding:3px 4px;border:1px solid #E5E5E5;border-radius:4px;width:100%;color:#3A3A3C" onchange="editItem('+i+',\'match\',this.value)">';
        h+='<option value="__new__"'+(!it.matched?' selected':'')+'>↳ Nuovo prodotto</option>';
        sup.products.forEach(function(p){h+='<option value="'+p.id+'"'+(it.matched&&it.matched.id===p.id?' selected':'')+'>↳ '+p.name+'</option>';});
        h+='</select></div>';
        h+='<button class="rm" onclick="removeParsedItem('+i+')">×</button>';
        h+='</div>';
      });
      h+='</div>';
      var newC=r.items.filter(function(it){return!it.matched;}).length;
      if(newC>0)h+='<p style="font-size:12px;color:#854F0B;margin-top:8px;padding:6px 10px;background:#FFF8EC;border-radius:8px">🆕 '+newC+' articoli verranno aggiunti come "Da fattura".</p>';
      h+='<button class="btn-confirm" onclick="confirmImport()">✓ Conferma e aggiorna medie</button>';
      h+='<button class="btn-analyze" style="background:#8E8E93;margin-top:6px" onclick="impStep=\'idle\';render()">← Indietro</button>';
    }
    h+='</div></div>';
  }

  // History viewer
  if(histView){
    var sup2=SUPS.find(function(s){return s.id===histView.sid;});
    var inv=(OS.history[loc][histView.sid]||[])[histView.idx];
    if(sup2&&inv){
      h+='<div class="ovl" onclick="if(event.target===this)closeHistView()"><div class="mdl">';
      h+='<div class="mdl-hd"><span class="mdl-title">📄 '+sup2.name+' · '+inv.date+(inv.invNum?' · #'+inv.invNum:'')+'</span>';
      h+='<button class="btn-x" onclick="closeHistView()">×</button></div>';
      h+='<div class="parse-list">';
      Object.keys(inv.items).forEach(function(pid){
        var p=sup2.products.find(function(x){return x.id===pid;});
        var name=p?p.name:pid;
        var unit=p?p.unit:'';
        h+='<div class="parse-row"><span style="font-weight:700">'+inv.items[pid]+'</span><span style="color:#8E8E93">'+unit+'</span><span>'+name+'</span></div>';
      });
      h+='</div>';
      h+='<button class="btn-analyze" style="background:#C00;margin-top:10px" onclick="closeHistView();deleteHistory(\''+histView.sid+'\','+histView.idx+')">🗑 Elimina fattura</button>';
      h+='</div></div>';
    }
  }

  return h;
}

function renderStatus(){
  var nh_ok=SUPS.filter(function(s){return s.src;}).length;
  var h='<div style="padding:12px 16px 80px">';
  h+='<div style="font-size:13px;font-weight:700;margin-bottom:8px">Stato dati \u2014 tutti i fornitori</div>';
  h+='<div class="sc">';
  SUPS.forEach(function(sup){
    var hnh=(OS.history.NH[sup.id]||[]).length;
    var hch=(OS.history.Chelsea[sup.id]||[]).length;
    var hasSrc=!!sup.src;
    var badge=hasSrc?'ok':'warn';
    var sub=hasSrc?sup.src:'Nessuna fattura \u2014 solo standing order da Consumo file';
    if(hnh>0||hch>0)sub+=' | Importate: NH '+hnh+', Chelsea '+hch;
    h+='<div class="sr"><span style="font-size:16px;width:22px;text-align:center;flex-shrink:0">'+(hasSrc?'\u2705':'\u26a0\ufe0f')+'</span>';
    h+='<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+sup.name+'</div><div style="font-size:12px;color:#8E8E93;margin-top:2px">'+sub+'</div></div>';
    h+='<span class="sbg '+badge+'">'+(badge==='ok'?'OK':'Parziale')+'</span></div>';
  });
  h+='</div>';
  h+='<div style="font-size:13px;font-weight:700;color:#C00;margin:16px 0 8px">Mancanti</div>';
  h+='<div class="sc">';
  [{n:'Fine Med Food',s:'Ordini WhatsApp'},{n:'LPB Bakery',s:'Portale online'},{n:'Marco Alimentari',s:'Portale online'},{n:'Annessa Food',s:'Account on hold'}].forEach(function(s){
    h+='<div class="sr"><span style="font-size:16px;width:22px;text-align:center">\u274c</span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+s.n+'</div><div style="font-size:12px;color:#8E8E93">'+s.s+'</div></div></div>';
  });
  h+='</div>';
  h+='<div style="background:#E6F1FB;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;color:#0C447C">';
  h+='<strong>Come importare una fattura (v5):</strong><br>';
  h+='<strong>📷 Screenshot / Foto</strong> — apri qualsiasi fornitore → 📥 Importa → 📸 → scegli o scatta. Anche più pagine.<br>';
  h+='<strong>📋 Testo</strong> — PDF → Ctrl+A → Ctrl+C → incolla nella tab "Testo".<br>';
  h+='<strong>🖼️ Incolla</strong> — con modal aperto, Cmd/Ctrl+V dagli appunti.<br><br>';
  h+='<strong>⚠️ Chiave API necessaria per Foto/Vision:</strong> apri il modal Importa → tocca 🔑 → incolla chiave Anthropic (sk-ant-…). Salvata solo in locale.<br>';
  h+='All Greens (testo): regex istantanea, non richiede chiave.';
  h+='</div>';
  h+='</div>';
  return h;
}

function render(){document.getElementById('main').innerHTML=curView==='orders'?renderOrders():renderStatus();}

// Global paste handler: while import modal is open, accept image from clipboard
window.addEventListener('paste',function(e){
  if(!impSup||impStep==='parsing'||impStep==='done')return;
  if(!e.clipboardData||!e.clipboardData.items)return;
  var files=[];
  for(var i=0;i<e.clipboardData.items.length;i++){
    var it=e.clipboardData.items[i];
    if(it.kind==='file'&&it.type.indexOf('image/')===0){var f=it.getAsFile();if(f)files.push(f);}
  }
  if(files.length){e.preventDefault();impMode='img';addImages(files);}
});

loadOS();render();
</script>
