by length + number/unit match\n  function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim();}\n  var stop={'the':1,'and':1,'with':1,'for':1,'pack':1,'each':1,'kilo':1,'fresh':1,'di':1,'da':1,'a':1,'la':1,'il':1,'lo':1,'gr':1,'kg':1,'ml':1,'cl':1,'pz':1};\n  var nl=norm(item.name);\n  var nTok=nl.split(' ').filter(function(w){return w.length>2&&!stop[w];});\n  var nNums=nl.match(/\\d+/g)||[];\n  var best=null,bestScore=0;\n  sup.products.forEach(function(p){\n    var pn=norm(p.name);\n    var pTok=pn.split(' ').filter(function(w){return w.length>2&&!stop[w];});\n    var score=0;\n    nTok.forEach(function(w){if(pTok.indexOf(w)>=0)score+=Math.min(w.length,8);});\n    // bonus if a number (e.g. weight/pack size) matches\n    var pNums=pn.match(/\\d+/g)||[];\n    nNums.forEach(function(n){if(pNums.indexOf(n)>=0)score+=3;});\n    if(score>bestScore){bestScore=score;best=p;}\n  });\n  return bestScore>=4?best:null;\n}\n\n// ── Render helpers ───────────────────────────────────────\nfunction stp(sid,pid,par,unit,dir){\n  var st=getState(sid,pid,par);\n  var s=unit==='kg'?0.5:1;\n  var q=Math.max(0,Math.round((st.qty+dir*s)*10)/10);\n  setState(sid,pid,par,{qty:q,on:q>0});\n}\nfunction acceptSug(sid,pid,par,sugVal){setState(sid,pid,par,{qty:sugVal,on:sugVal>0});}\n\nfunction rItem(sup,prod,isX){\n  var par=getPar(sup,prod);\n  var st=getState(sup.id,prod.id,par);\n  var on=st.on!==false,qty=st.qty;\n  var sm=isX?' sm':'';\n  var h='<div class=\"item-row'+(on?'':' excl')+(isX?' xrow':'')+'\">';\n  h+='<label class=\"sw\"><input type=\"checkbox\"'+(on?' checked':'')+' onchange=\"setState(\\''+sup.id+'\\',\\''+prod.id+'\\','+par+',{on:this.checked,qty:this.checked?'+(par>0?par:1)+':0});\"><span class=\"sw-t\"><\u002Fspan><span class=\"sw-k\"><\u002Fspan><\u002Flabel>';\n  h+='<div class=\"iinfo\"><div class=\"iname'+(on?'':' off')+(isX?' sm':'')+'\">'+prod.name+'<\u002Fdiv>';\n  if(!isX){\n    var sug=getSuggested(sup.id,prod.id);\n
